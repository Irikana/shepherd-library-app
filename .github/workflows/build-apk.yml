name: Build APK

# 版本规则（见工作区根 AGENTS.md「版本号规则（全软件统一）」）：
#   package.json 的 version 只维护三位正式版本 A.B.C；
#   push main / 手动触发 = 测试构建：产物版本 A.B.C-<run_number>，只出 artifact，不建 tag、不建 Release；
#   推送 vA.B.C 标签 = 正式发布：产物版本 A.B.C，创建 GitHub Release 并上传 APK。
#   （旧行为「普通 push 也顺手建 Release」已在 alpha 统一规则中废止：Release 只跟随 tag。）

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    # 创建 GitHub Release 需要 contents: write（仓库默认只读时会失败）
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Apply Android build patches (@expo/dom-webview SDK 52 compat)
        run: node scripts/patch-android.js

      # 测试构建注入第四位（A.B.C-<run_number>）；tag 正式构建不改版本字符串，
      # 但同样用 run_number 填 Android versionCode，保证两条通道都能装（版本号只增不减）
      - name: Inject build number
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            node scripts/ci-version.js "${{ github.run_number }}" --official
          else
            node scripts/ci-version.js "${{ github.run_number }}"
          fi

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build Release APK (self-contained JS bundle)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1g"

      - name: Read version
        id: version
        run: echo "ver=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shepherd-library-app-v${{ steps.version.outputs.ver }}-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Create GitHub Release (official builds only)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="changelog/CHANGELOG-${TAG#v}.md"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" android/app/build/outputs/apk/release/app-release.apk --clobber
          else
            gh release create "${TAG}" \
              android/app/build/outputs/apk/release/app-release.apk \
              --title "SlyWrite ${TAG}" \
              --notes "牧羊人图书馆写作管理 App 发布。更新说明见 ${NOTES}"
          fi
