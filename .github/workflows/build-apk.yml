name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Show pre-patch file contents
        run: |
          echo "=== @expo/dom-webview/android/build.gradle ==="
          if [ -f "node_modules/@expo/dom-webview/android/build.gradle" ]; then
            cat node_modules/@expo/dom-webview/android/build.gradle
          else
            echo "FILE NOT FOUND"
          fi
          echo ""
          echo "=== expo-modules-core/android/ExpoModulesCorePlugin.gradle ==="
          if [ -f "node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle" ]; then
            cat node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
          else
            echo "FILE NOT FOUND"
          fi
          echo ""
          echo "=== Checking package versions ==="
          cat node_modules/@expo/dom-webview/package.json | grep version | head -1
          cat node_modules/expo-modules-core/package.json | grep version | head -1

      - name: Apply Android build patches
        run: node scripts/patch-android.js

      - name: Show post-patch file contents
        run: |
          echo "=== @expo/dom-webview/android/build.gradle (after patch) ==="
          if [ -f "node_modules/@expo/dom-webview/android/build.gradle" ]; then
            cat node_modules/@expo/dom-webview/android/build.gradle
          else
            echo "FILE NOT FOUND"
          fi
          echo ""
          echo "=== expo-modules-core/android/ExpoModulesCorePlugin.gradle (after patch) ==="
          if [ -f "node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle" ]; then
            cat node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
          else
            echo "FILE NOT FOUND"
          fi

      - name: Verify patches
        run: |
          echo "Checking @expo/dom-webview patch..."
          DW_FILE="node_modules/@expo/dom-webview/android/build.gradle"
          if [ ! -f "$DW_FILE" ]; then
            echo "WARNING: $DW_FILE does not exist - skipping dom-webview checks"
          else
            if grep -q "expo-module-gradle-plugin" "$DW_FILE"; then
              echo "ERROR: dom-webview still has expo-module-gradle-plugin!"
              exit 1
            else
              echo "OK: dom-webview plugin removed"
            fi
            if grep -q "compileSdkVersion" "$DW_FILE"; then
              echo "OK: dom-webview has SDK versions"
            else
              echo "ERROR: dom-webview missing SDK versions!"
              exit 1
            fi
          fi
          echo "Checking ExpoModulesCorePlugin patch..."
          EM_FILE="node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle"
          if [ ! -f "$EM_FILE" ]; then
            echo "WARNING: $EM_FILE does not exist - skipping expo-modules-core checks"
          else
            if grep -q "findByName" "$EM_FILE"; then
              echo "OK: ExpoModulesCorePlugin patched"
            else
              echo "WARNING: ExpoModulesCorePlugin not patched (may not need it)"
            fi
          fi

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shepherd-library-app-v0.0.1
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
