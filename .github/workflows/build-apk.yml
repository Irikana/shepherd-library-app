name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Apply Android build patches
        run: node scripts/patch-android.js

      - name: Verify patches
        run: |
          echo "Checking @expo/dom-webview patch..."
          if grep -q "expo-module-gradle-plugin" node_modules/@expo/dom-webview/android/build.gradle; then
            echo "ERROR: dom-webview still has expo-module-gradle-plugin!"
            exit 1
          else
            echo "OK: dom-webview plugin removed"
          fi
          if grep -q "compileSdkVersion" node_modules/@expo/dom-webview/android/build.gradle; then
            echo "OK: dom-webview has SDK versions"
          else
            echo "ERROR: dom-webview missing SDK versions!"
            exit 1
          fi
          echo "Checking ExpoModulesCorePlugin patch..."
          if grep -q "findByName" node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle; then
            echo "OK: ExpoModulesCorePlugin patched"
          else
            echo "ERROR: ExpoModulesCorePlugin not patched!"
            exit 1
          fi

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shepherd-library-app-v0.0.1
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30